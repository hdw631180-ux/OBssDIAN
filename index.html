<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>archweb — Arch Linux dans le navigateur</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l12 7v14l-12 7-12-7V9z' fill='%230b0e14' stroke='%23ff3b47' stroke-width='2.5'/%3E%3Cpath d='M21.5 9H11.5V23H21.5M11.5 16H19.5' fill='none' stroke='%23ff3b47' stroke-width='2.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#0b0e14;--fg:#c5c8c6;--ac:#e5383b;--dim:#5c6370;--bd:#232834;--red:#e06c75;--grn:#98c379;--ylw:#e5c07b}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:13px/1.4 ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;overflow:hidden}
#boot{position:fixed;inset:0;z-index:9;background:#000;color:#bbb;padding:16px;white-space:pre-wrap;overflow:hidden}
#boot .ok{color:var(--grn)}
#desk{display:flex;flex-direction:column;height:100%}
#bar{display:flex;align-items:center;gap:6px;height:28px;padding:0 8px;background:#0f131c;border-bottom:1px solid var(--bd);flex:none;white-space:nowrap}
#bar .w{padding:2px 9px;border-radius:3px;color:var(--dim);cursor:pointer}
#bar .w.has{color:var(--fg)}
#bar .w.on{background:var(--ac);color:#04121b;font-weight:700}
#bar .t{flex:1;text-align:center;color:var(--dim);overflow:hidden;text-overflow:ellipsis}
#bar .b{border:1px solid var(--bd);background:none;color:var(--fg);font:inherit;padding:1px 8px;border-radius:3px;cursor:pointer}
#bar .b:hover{border-color:var(--ac);color:var(--ac)}
#bar .logo{display:flex;align-items:center;gap:6px;color:var(--ac);font-weight:700;padding-right:4px}
#area{position:relative;flex:1;margin:6px;min-height:0}
.win{position:absolute;display:none;flex-direction:column;background:#0e121a;border:2px solid var(--bd);border-radius:4px;overflow:hidden}
.win.f{border-color:var(--ac)}
.tb{display:flex;justify-content:space-between;padding:2px 8px;font-size:11px;background:#131824;color:var(--dim);flex:none}
.tb .x{cursor:pointer;font-size:14px;line-height:1}
.tb .x:hover{color:var(--red)}
.bd{flex:1;overflow:auto;padding:8px;white-space:pre-wrap;word-break:break-word}
.ln{display:flex}
.ln input{flex:1;min-width:0;background:none;border:0;outline:0;color:inherit;font:inherit;caret-color:var(--ac)}
.a{color:var(--ac)}.g{color:var(--grn)}.r{color:var(--red)}.y{color:var(--ylw)}.d{color:var(--dim)}
.wiki h2{margin:0 0 6px;color:var(--ac);font-size:16px}
.wiki h3{margin:14px 0 4px;color:var(--ylw);font-size:13px}
.wiki{white-space:normal;max-width:72ch}
.wiki kbd{border:1px solid var(--bd);background:#131824;border-radius:3px;padding:0 5px;color:var(--grn)}
.wiki code{color:var(--ac)}
.wiki p,.wiki li{margin:3px 0}
.wiki ul{padding-left:18px;margin:4px 0}
#desk{position:relative}
#dock,#lc,#bat{display:none}
.mk{width:18px;height:18px;vertical-align:middle}
.tb b{cursor:pointer;width:22px;height:22px;border-radius:6px;display:inline-grid;place-items:center;font-size:13px}
.tb .m,.tb .mx{display:none}
.toast{position:fixed;top:40px;right:14px;z-index:999999;background:#0f172af0;border:1px solid #ffffff22;border-left:3px solid var(--ac);padding:10px 14px;border-radius:8px;color:#e2e8f0;font:13px system-ui;animation:in .25s}
@keyframes in{from{opacity:0;transform:translateX(20px)}}
.app{white-space:normal!important;padding:0!important;font:13px system-ui;color:#e2e8f0}
.fm{display:grid;grid-template-columns:140px 1fr 1fr;height:100%}
.fs{border-right:1px solid #ffffff14;padding:8px}.fl{overflow:auto;padding:8px}
.fi,.fe{padding:6px 10px;border-radius:6px;cursor:pointer;display:flex;gap:8px;align-items:center}
.fi:hover,.fe:hover{background:#ffffff10}.fi.on,.fe.on{background:color-mix(in srgb,var(--ac) 30%,transparent)}
.fv{padding:12px;white-space:pre-wrap;border-left:1px solid #ffffff14;font:12px ui-monospace,monospace;overflow:auto}
.fp{color:var(--dim);padding:2px 8px 8px}.up{cursor:pointer;color:var(--ac);margin-right:6px}
.st{padding:16px}.st h2{margin:0 0 4px}
.st h3{margin:16px 0 8px;font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:.08em}
.sr{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #ffffff10}.sr>div{flex:1}
.st button{background:var(--ac);color:#04121b;border:0;border-radius:8px;padding:6px 14px;font:inherit;font-weight:600;cursor:pointer}
.st button.rm{background:#ffffff18;color:#e2e8f0}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw i{width:56px;height:36px;border-radius:8px;border:2px solid #ffffff30;cursor:pointer}.sw i:hover{border-color:#fff}
.sw i[data-a]{width:30px;height:30px;border-radius:50%}
#dock{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);gap:10px;padding:8px 12px;background:#0b111bb3;backdrop-filter:blur(18px);border:1px solid #ffffff1c;border-radius:20px;z-index:99998;align-items:center;box-shadow:0 10px 40px #000a}
.dk{position:relative;cursor:pointer;transition:transform .12s ease-out;transform-origin:50% 100%}
@keyframes bnc{0%,100%{transform:translateY(0)}30%{transform:translateY(-24px)}55%{transform:translateY(0)}72%{transform:translateY(-10px)}}
.dk.bounce{animation:bnc .8s ease}
.dk svg{display:block}.dk .mk{width:46px;height:46px;padding:8px;background:#ffffff12;border-radius:12px}
.dk.run::after{content:"";position:absolute;left:50%;bottom:-6px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--ac)}
.sep{width:1px;height:34px;background:#ffffff22;margin:0 4px}
#lc{position:absolute;inset:30px 0 0 0;z-index:100000;background:#04070dcc;backdrop-filter:blur(22px);flex-direction:column;align-items:center;padding:56px 16px;gap:28px}
#lc.open{display:flex}
#lc input{width:min(440px,90%);background:#ffffff14;border:1px solid #ffffff22;border-radius:12px;padding:12px 16px;color:#fff;font:15px system-ui;outline:0}
#lcg{display:flex;flex-wrap:wrap;gap:22px;justify-content:center;max-width:560px}
.ap{width:92px;text-align:center;cursor:pointer;font:12px system-ui;color:#e2e8f0}.ap svg{display:block;margin:0 auto 6px;transition:transform .15s}.ap:hover svg{transform:scale(1.1)}
body.winmode #desk{background:var(--wp)}
body.winmode #area{margin-bottom:84px}
body.winmode #bat{display:inline}
body.winmode #bar{height:30px;background:#05080fcc;backdrop-filter:blur(14px);border-bottom:1px solid #ffffff12}
body.winmode #bar .logo,body.winmode #bar .b[data-sp],body.winmode #pk{display:none}
body.winmode #bar .w.start{display:flex;align-items:center;gap:7px;padding:2px 10px;background:#ffffff10;color:#fff;border-radius:8px}
body.winmode .win{background:#0c1119ee;backdrop-filter:blur(18px);border-radius:12px;border:1px solid #ffffff1f;box-shadow:0 18px 50px #000a;resize:both;min-width:260px;min-height:140px}
body.winmode .win.f{border-color:var(--ac);box-shadow:0 18px 50px #000c,0 0 0 1px var(--ac)}
body.winmode .tb{background:transparent;color:#cbd5e1;font:12px system-ui;padding:6px 8px 6px 14px;touch-action:none}
body.winmode .tb b{color:#94a3b8}body.winmode .tb b:hover{background:#ffffff18;color:#fff}
body.winmode .tb .x:hover{background:#ef4444;color:#fff}
body.winmode .tb .m,body.winmode .tb .mx{display:inline-grid}
@keyframes winIn{from{opacity:0;transform:scale(.88) translateY(14px)}60%{opacity:1;transform:scale(1.02)}to{transform:none}}
@keyframes winOut{to{opacity:0;transform:scale(.88)}}
@keyframes winMin{to{transform:translate(var(--tx),var(--ty)) scale(.08,.03);opacity:0;border-radius:60px}}
@keyframes winRs{from{transform:translate(var(--tx),var(--ty)) scale(.08,.03);opacity:0}}
@keyframes lcIn{from{opacity:0}}
@keyframes apIn{from{opacity:0;transform:translateY(16px) scale(.9)}}
@keyframes drift{to{transform:translate(6%,4%) rotate(8deg)}}
.ap{animation:apIn .4s cubic-bezier(.2,.9,.3,1.2) both}
#lc.open{animation:lcIn .28s ease}
body.winmode .win{transition:box-shadow .25s,border-color .25s}
body.winmode .win.opening{animation:winIn .42s cubic-bezier(.2,.9,.3,1)}
body.winmode .win.closing{animation:winOut .22s ease-in forwards;pointer-events:none}
body.winmode .win.minimizing{animation:winMin .32s cubic-bezier(.5,0,.8,.4) forwards;pointer-events:none}
body.winmode .win.restoring{animation:winRs .36s cubic-bezier(.2,.9,.3,1)}
body.winmode .win.tr{transition:left .34s cubic-bezier(.3,.9,.3,1),top .34s cubic-bezier(.3,.9,.3,1),width .34s cubic-bezier(.3,.9,.3,1),height .34s cubic-bezier(.3,.9,.3,1)}
/* feux tricolores façon macOS */
body.winmode .tb{gap:10px;padding:11px 14px}
body.winmode .tb>span:last-child{order:-1;display:flex;gap:8px}
body.winmode .tb .tt{flex:1;text-align:center;margin-right:52px}
body.winmode .tb b{width:12px;height:12px;border-radius:50%;font-size:0;color:#0009!important;font-weight:700;line-height:1;transition:filter .15s}
body.winmode .tb>span:last-child:hover b{font-size:10px}
body.winmode .tb b:hover{filter:brightness(1.15)}
body.winmode .tb b.x{order:1;background:#ff5f57!important}
body.winmode .tb b.m{order:2;background:#febc2e!important}
body.winmode .tb b.mx{order:3;background:#28c840!important}
/* liquid glass */
body.winmode #desk{overflow:hidden}
body.winmode #desk::before{content:"";position:absolute;inset:-20%;z-index:0;pointer-events:none;background:radial-gradient(circle at 30% 30%,#ff6b6b55,transparent 30%),radial-gradient(circle at 72% 62%,#fbbf2433,transparent 28%),radial-gradient(circle at 55% 15%,#ec489944,transparent 25%);animation:drift 24s ease-in-out infinite alternate}
body.winmode #bar{position:relative;z-index:5;background:#0a0d1459;backdrop-filter:blur(26px) saturate(190%);-webkit-backdrop-filter:blur(26px) saturate(190%);border-bottom:1px solid #ffffff1f;box-shadow:inset 0 -1px 0 #ffffff0d}
body.winmode .win{background:linear-gradient(135deg,#ffffff26,#ffffff08 45%,#ffffff14),#0a0d1480;backdrop-filter:blur(26px) saturate(190%);-webkit-backdrop-filter:blur(26px) saturate(190%);border:1px solid #ffffff14;box-shadow:inset 0 1px 0 #ffffff59,inset 0 -1px 0 #ffffff14,inset 0 0 24px #ffffff0f,0 24px 60px #0009}
body.winmode .win.f{border-color:#ffffff2e;box-shadow:inset 0 1px 0 #ffffff80,inset 0 -1px 0 #ffffff1f,inset 0 0 28px #ffffff14,0 28px 70px #000b,0 0 0 1px color-mix(in srgb,var(--ac) 50%,transparent)}
body.winmode .win::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(120% 55% at 0% 0%,#ffffff2e,transparent 50%),radial-gradient(80% 40% at 100% 100%,#ffffff12,transparent 60%);pointer-events:none;z-index:1}
body.winmode .win::after,#dock::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:linear-gradient(135deg,#ffffffb3,#ffffff0d 30%,#ffffff0d 70%,#ffffff66);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
#dock{background:linear-gradient(135deg,#ffffff2e,#ffffff0d 50%,#ffffff1a),#0a0d1466;backdrop-filter:blur(26px) saturate(200%);-webkit-backdrop-filter:blur(26px) saturate(200%);border:1px solid #ffffff14;box-shadow:inset 0 1px 0 #ffffff66,inset 0 -1px 0 #ffffff14,0 14px 44px #000a}
#lc{background:#04070d99}
#lc input{background:linear-gradient(135deg,#ffffff26,#ffffff0d);backdrop-filter:blur(20px);border:1px solid #ffffff2e;box-shadow:inset 0 1px 0 #ffffff59}
.toast{background:linear-gradient(135deg,#ffffff26,#ffffff0d),#0a0d14b3;backdrop-filter:blur(22px) saturate(180%);box-shadow:inset 0 1px 0 #ffffff59,0 12px 30px #0008}
.st button{background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 85%,#fff),var(--ac));box-shadow:inset 0 1px 0 #ffffff80,0 4px 12px color-mix(in srgb,var(--ac) 40%,transparent)}
.st button.rm{background:linear-gradient(180deg,#ffffff2e,#ffffff14);box-shadow:inset 0 1px 0 #ffffff4d}
#bar .b.syn{border-color:var(--ac);color:var(--ac)}
#dsk{display:none;position:absolute;left:14px;top:44px;z-index:1}
body.winmode #dsk{display:block}
.di{width:88px;text-align:center;color:#fff;font:12px system-ui;cursor:pointer;padding:8px 4px;border-radius:14px;text-shadow:0 1px 4px #000}
.di:hover{background:#ffffff1f}.di svg{display:block;margin:0 auto 6px}
body.dragging iframe{pointer-events:none}
@media (max-width:700px){#bar .hide{display:none}#dock{gap:6px;padding:6px 8px}.dk svg{width:36px;height:36px}.dk .mk{width:36px;height:36px;padding:5px}#bar{gap:4px}#bar .logo{font-size:0}#bar .b{padding:1px 6px}#clk{display:none}}
</style>
</head>
<body>
<div id="boot"></div>
<div id="desk" hidden>
  <div id="bar">
    <span class="logo"></span><span id="wss"></span>
    <span class="t" id="ttl"></span>
    <button class="b" data-sp="term">term</button>

    <button class="b hide" data-sp="btop">btop</button>

    <span class="d hide" id="pk"></span>
    <span id="clk"></span>

  <div id="dock"></div>
  <div id="dsk"></div>
  <div id="lc"><input placeholder="Rechercher une application…" spellcheck="false"><div id="lcg"></div></div>

<script>
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const T0=Date.now();

/* ---------- système de fichiers virtuel ---------- */
const fs={
  home:{user:{
    'readme.md':'# archweb\nBienvenue. Tape `help`.\nKeep it simple, btw.',
    '.bashrc':'alias ll="ls -la"\nexport EDITOR=vim\nPS1="[\\u@\\h \\W]\\$ "',
    'notes.txt':'- installer cowsay (sudo pacman -S cowsay)\n- lire le wiki : Alt+W\n- ne jamais dire "Ubuntu" ici',
    projects:{'hello.sh':'#!/bin/bash\necho "I use Arch btw"'},
    Applications:{'synapse.app':'Synapse : second cerveau (graphe 3D).\nDossier du site : /synapse/\nLancer : commande `synapse`, Alt+S, ou le dock.'}
  }},
  etc:{'os-release':'NAME="Arch Linux"\nPRETTY_NAME="Arch Linux"\nID=arch\nBUILD_ID=rolling\nHOME_URL="https://archlinux.org/"','hostname':'archweb','motd':'Welcome to archweb.'},
  usr:{bin:{}},var:{log:{'pacman.log':'[PACMAN] Running \'pacman -Syu\''}},tmp:{}
};
const get=p=>{let n=fs;for(const k of p){if(typeof n!=='object'||!(k in n))return;n=n[k]}return n};
const norm=(path,cwd)=>{
  if(path==='~'||path.startsWith('~/'))path='/home/user'+path.slice(1);
  const out=path.startsWith('/')?[]:[...cwd];
  for(const s of path.split('/')){if(!s||s==='.')continue;s==='..'?out.pop():out.push(s)}

/* ---------- fenêtres tilées ---------- */
const WS=[[],[],[],[]];let cur=0,focus=null,uid=0,mode='tile',Z=1;const ALL=()=>WS.flat();

function tile(){
  if(mode==='win')return tileWin();
  const area=$('#area'),ws=WS[cur],n=ws.length,W=area.clientWidth,H=area.clientHeight,g=6;
  document.querySelectorAll('.win').forEach(e=>e.style.display='none');
  ws.forEach((w,i)=>{
    let x=0,y=0,ww=W,hh=H;
    if(W<700){hh=(H-g*(n-1))/n;y=i*(hh+g)}
    else if(n>1){
      if(i===0){ww=Math.floor(W*.55)-g/2}
      else{const m=n-1;hh=(H-g*(m-1))/m;x=Math.floor(W*.55)+g/2;y=(i-1)*(hh+g);ww=W-x}
    }
    Object.assign(w.el.style,{display:'flex',left:x+'px',top:y+'px',width:ww+'px',height:hh+'px'});
    w.el.classList.toggle('f',w===focus);
  });
  $('#wss').innerHTML=WS.map((l,i)=>`<span class="w${i===cur?' on':''}${l.length?' has':''}" data-ws="${i}">${i+1}</span>`).join('');
  $('#ttl').textContent=focus?focus.title:'archweb';
  if(focus&&focus.term)focus.term.inp.focus();
}
function tileWin(){
  const area=$('#area'),W=area.clientWidth,H=area.clientHeight,all=ALL();
  document.querySelectorAll('.win:not(.closing):not(.minimizing)').forEach(e=>e.style.display='none');
  all.forEach((w,i)=>{
    if(!w.init){
      const k=i%6;
      Object.assign(w.el.style,{left:Math.max(0,Math.min(90+k*28,W-220))+'px',top:20+k*28+'px',width:Math.min(w.type==='syn'?880:520,W-12)+'px',height:Math.min(w.type==='syn'?560:340,H-40)+'px'});
      w.init=true;w.max=false;
    }
    w.el.style.display=w.min?'none':'flex';
    if(w._rs&&!w.min){w._rs=0;w.el.classList.add('restoring');setTimeout(()=>w.el.classList.remove('restoring'),380)}
    w.el.style.zIndex=w.z||1;
    w.el.classList.toggle('f',w===focus&&!w.min);
  });
  $('#wss').innerHTML='<span class="w start" data-start>'+MARK+'<b>Lumen</b></span>';
  $('#ttl').textContent=focus&&!focus.min?focus.title:'Bureau';
  dock();
  if(focus&&focus.term&&!focus.min)focus.term.inp.focus();
}
function setTitle(w,t){w.title=t;w.el.querySelector('.tt').textContent=t;if(mode==='win')tile();else if(w===focus)$('#ttl').textContent=t}
function closeWin(w){
  for(const l of WS){const i=l.indexOf(w);if(i>-1)l.splice(i,1)}
  w.stop&&w.stop();focus=(mode==='win'?ALL().filter(x=>!x.min).at(-1):WS[cur][0])||null;
  if(mode==='win'&&w.el.style.display!=='none'){w.el.classList.add('closing');setTimeout(()=>w.el.remove(),230)}else w.el.remove();
  tile();
}
function switchWs(n){cur=n;focus=WS[n][0]||null;tile()}
function moveTo(n){
  if(!focus||n===cur)return;
  WS[cur].splice(WS[cur].indexOf(focus),1);WS[n].push(focus);
  focus=WS[cur][0]||null;tile();
}
function cycle(d){
  const ws=mode==='win'?ALL().filter(x=>!x.min):WS[cur];if(!ws.length)return;
  focus=ws[(ws.indexOf(focus)+d+ws.length)%ws.length];focus.z=++Z;tile();
}

function spawn(type){

/* ---------- terminal ---------- */
const C={};
function mkTerm(bd,w){
  const t={cwd:['home','user'],hist:[],hi:0,busy:false,w};
  const out=document.createElement('div'),row=document.createElement('div');
  row.className='ln';
  const pr=document.createElement('span'),inp=document.createElement('input');
  inp.spellcheck=false;inp.autocapitalize='off';inp.autocomplete='off';
  row.append(pr,inp);bd.append(out,row);t.inp=inp;
  const dir=()=>{const j=t.cwd.join('/');return j==='home/user'?'~':j.startsWith('home/user/')?'~/'+j.slice(10):'/'+j};
  const prompt=()=>`<span class="g">[user</span><span class="d">@</span><span class="a">archweb</span> ${esc(dir())}<span class="g">]</span>$&nbsp;`;
  t.p=(s='',c='')=>{const d=document.createElement('div');d.innerHTML=c?`<span class="${c}">${esc(s)}</span>`:esc(s);out.append(d);bd.scrollTop=bd.scrollHeight};
  t.h=h=>{const d=document.createElement('div');d.innerHTML=h;out.append(d);bd.scrollTop=bd.scrollHeight};
  t.clear=()=>{out.innerHTML=''};
  t.dir=dir;
  const refresh=()=>{pr.innerHTML=prompt();setTitle(w,'user@archweb: '+dir())};
  t.refresh=refresh;refresh();
  bd.addEventListener('click',()=>{if(!getSelection().toString())inp.focus()});
  inp.addEventListener('keydown',async e=>{
    if(e.altKey)return;
    if(e.key==='Enter'){
      if(t.busy)return;
      const line=inp.value;inp.value='';
      t.h(prompt()+esc(line));
      if(line.trim()){t.hist.push(line);t.hi=t.hist.length;t.busy=true;
        try{await run(t,line)}catch(err){t.p('bash: '+err.message,'r')}
        t.busy=false}
      refresh();inp.focus();
    }else if(e.key==='ArrowUp'){e.preventDefault();if(t.hi>0)inp.value=t.hist[--t.hi]}
    else if(e.key==='ArrowDown'){e.preventDefault();inp.value=t.hi<t.hist.length-1?t.hist[++t.hi]:(t.hi=t.hist.length,'')}
    else if(e.key==='l'&&e.ctrlKey){e.preventDefault();t.clear()}
    else if(e.key==='Tab'){
      e.preventDefault();
      const parts=inp.value.split(/\s+/),last=parts.pop(),first=parts.length===0;
      const pool=first?[...Object.keys(C)]:Object.keys(get(t.cwd)||{});
      const m=pool.filter(x=>x.startsWith(last));
      if(m.length===1){inp.value=[...parts,m[0]].join(' ')+(first?' ':'')}
      else if(m.length>1)t.p(m.join('  '),'d');
    }
  });
  return t;
}

async function run(t,line){
  const toks=[...line.matchAll(/"([^"]*)"|'([^']*)'|(\S+)/g)].map(m=>m[1]??m[2]??m[3]);
  let root=false;
  if(toks[0]==='sudo'){toks.shift();root=true}
  const cmd=toks.shift();if(!cmd)return;
  const fn=C[cmd];
  if(fn){await fn(toks,t,root);return}
  if(BIN[cmd]&&inst.has(BIN[cmd])){t.p(cmd+': ce programme est simulé dans le navigateur.','d');return}
  t.p(`bash: ${cmd}: command not found`);
}

/* ---------- commandes ---------- */
const ASCII_COW=(s)=>{const l='_'.repeat(s.length+2),b='-'.repeat(s.length+2);
  return ` ${l}\n< ${s} >\n ${b}\n        \\   ^__^\n         \\  (oo)\\_______\n            (__)\\       )\\/\\\n                ||----w |\n                ||     ||`};
Object.assign(C,{
  help(a,t){t.h(`<span class="a">Commandes :</span> help ls cd pwd cat echo mkdir touch rm clear whoami hostname uname date uptime
neofetch pacman wiki btop theme synapse lumen arch exit
<span class="a">Après pacman -S :</span> cowsay sl fortune htop btop vim git
<span class="a">Clavier :</span> Alt+Entrée nouveau terminal · Alt+Shift+Q fermer · Alt+1..4 bureau · Alt+Shift+1..4 déplacer · Alt+J/K focus · Alt+W wiki · Alt+B btop · Alt+S Synapse · Alt+M Arch⇄Lumen · Alt+Espace lanceur`)},
  clear(a,t){t.clear()},
  whoami(a,t){t.p('user')},
  hostname(a,t){t.p('archweb')},
  pwd(a,t){t.p('/'+t.cwd.join('/'))},
  date(a,t){t.p(new Date().toString())},
  uptime(a,t){const m=Math.floor((Date.now()-T0)/60000);t.p(` up ${m} min, 1 user, load average: 0.00, 0.01, 0.00`)},
  uname(a,t){t.p(a.includes('-a')?'Linux archweb 6.12.0-arch1-1 #1 SMP PREEMPT_DYNAMIC x86_64 GNU/Linux':'Linux')},
  echo(a,t){
    const i=a.indexOf('>');
    if(i<0){t.p(a.join(' '));return}
    const f=norm(a[i+1]||'',t.cwd),d=get(f.slice(0,-1));
    if(d&&typeof d==='object'){d[f.at(-1)]=a.slice(0,i).join(' ')+'\n'}else t.p('bash: no such directory','r');
  },
  ls(a,t){
    const all=a.some(x=>/^-.*a/.test(x)),p=a.find(x=>!x.startsWith('-')),n=get(p?norm(p,t.cwd):t.cwd);
    if(n===undefined)return t.p(`ls: cannot access '${p}': No such file or directory`,'r');
    if(typeof n==='string')return t.p(p);
    const names=Object.keys(n).filter(k=>all||!k.startsWith('.')).sort();
    t.h(names.map(k=>typeof n[k]==='object'?`<span class="a">${esc(k)}/</span>`:esc(k)).join('  ')||'');
  },
  cd(a,t){
    const p=norm(a[0]||'~',t.cwd),n=get(p);
    if(n===undefined)t.p(`bash: cd: ${a[0]}: No such file or directory`,'r');
    else if(typeof n==='string')t.p(`bash: cd: ${a[0]}: Not a directory`,'r');
    else t.cwd=p;
  },
  cat(a,t){
    if(!a.length)return;
    for(const f of a){const n=get(norm(f,t.cwd));
      if(n===undefined)t.p(`cat: ${f}: No such file or directory`,'r');
      else if(typeof n==='object')t.p(`cat: ${f}: Is a directory`,'r');
      else t.p(n)}
  },
  mkdir(a,t){for(const f of a){const p=norm(f,t.cwd),d=get(p.slice(0,-1));
    if(d&&typeof d==='object'&&!(p.at(-1) in d))d[p.at(-1)]={};else t.p(`mkdir: cannot create directory '${f}'`,'r')}},
  touch(a,t){for(const f of a){const p=norm(f,t.cwd),d=get(p.slice(0,-1));if(d&&typeof d==='object'&&!(p.at(-1) in d))d[p.at(-1)]=''}},
  rm(a,t){
    if(a.includes('/')||a.includes('/*'))return t.p("rm: it is dangerous to operate recursively on '/'",'r');
    for(const f of a.filter(x=>!x.startsWith('-'))){const p=norm(f,t.cwd),d=get(p.slice(0,-1));
      if(d&&typeof d==='object'&&p.at(-1) in d)delete d[p.at(-1)];else t.p(`rm: cannot remove '${f}': No such file or directory`,'r')}
  },
  exit(a,t){closeWin(t.w)},
  wiki(){spawn('wiki')},
  lumen(){setMode('win')},
  synapse(){spawn('syn')},
  arch(){setMode('tile')},
  btop(){if(inst.has('btop'))spawn('btop');else throw new Error('btop: command not found')},
  htop(){if(inst.has('htop'))spawn('btop');else throw new Error('htop: command not found')},
  theme(a,t){
    const m={blue:'#1793d1',green:'#98c379',red:'#e06c75',yellow:'#e5c07b',purple:'#c678dd'};
    if(!m[a[0]])return t.p('usage: theme blue|green|red|yellow|purple');
    document.documentElement.style.setProperty('--ac',m[a[0]]);
  },
  neofetch(a,t){
    const up=Math.max(1,Math.floor((Date.now()-T0)/60000)),
    info=[`<span class="a">user</span>@<span class="a">archweb</span>`,'-----------',
      'OS: Arch Linux x86_64 (btw)','Host: GitHub Pages','Kernel: 6.12.0-arch1-1',`Uptime: ${up} min`,
      `Packages: ${inst.size} (pacman)`,'Shell: bash 5.2','WM: archweb-tile','Terminal: archweb-term',
      `CPU: ${navigator.hardwareConcurrency||'?'} threads`,`Resolution: ${innerWidth}x${innerHeight}`];
    t.h(LOGO.map((l,i)=>`<span class="a">${esc(l.padEnd(38))}</span>${i<info.length?info[i].replace(/^(\w+):/,'<span class="a">$1</span>:'):''}`).join('\n'));
  },
  fortune(a,t){if(!inst.has('fortune-mod'))throw new Error('fortune: command not found');t.p(FORT[Math.floor(Math.random()*FORT.length)])},
  cowsay(a,t){if(!inst.has('cowsay'))throw new Error('cowsay: command not found');t.p(ASCII_COW(a.join(' ')||'I use Arch btw'))},
  sl(a,t){if(!inst.has('sl'))throw new Error('sl: command not found');t.p('      ====        ________                ___________\n  _D _|  |_______/        \\__I_I_____===__|_________|\n   |(_)---  |   H\\________/ |   |        =|___ ___|\n   /     |  |   H  |  |     |   |         ||_| |_||\n  |      |  |   H  |__--------------------| [___] |\n  | ________|___H__/__|_____/[][]~\\_______|       |\n  |/ |   |-----------I_____I [][] []  D   |=======|__','y')},
  async pacman(a,t,root){
    const f=a[0]||'',pk=a.slice(1);
    const need=()=>{if(!root){t.p('error: you cannot perform this operation unless you are root.','r');return true}};
    if(/^-Q/.test(f)){t.p([...inst].sort().map(x=>x+' 1.0-1').join('\n'));return}
    if(/^-Ss/.test(f)){for(const k in REPO)if(!pk[0]||k.includes(pk[0]))t.h(`<span class="a">extra/</span><b>${k}</b>${inst.has(k)?' <span class="g">[installed]</span>':''}\n    ${REPO[k]}`);return}
    if(/^-Sy/.test(f)&&!pk.length){
      if(need())return;
      t.p(':: Synchronizing package databases...');
      for(const r of ['core','extra']){await sleep(300);t.p(` ${r}  is up to date`)}
      await sleep(300);t.p(':: Starting full system upgrade...');await sleep(300);t.p(' there is nothing to do');return;
    }
    if(/^-S/.test(f)&&pk.length){
      if(need())return;
      for(const k of pk){
        if(!(k in REPO)){t.p(`error: target not found: ${k}`,'r');return}
        if(inst.has(k)){t.p(`warning: ${k} is up to date -- reinstalling`,'y')}
        t.p('resolving dependencies...\nlooking for conflicting packages...\n\nPackages (1) '+k+'\n\n:: Proceed with installation? [Y/n] y');
        const d=document.createElement('div');t.h('');
        for(let i=0;i<=10;i++){await sleep(110);d.textContent=`(1/1) installing ${k}  [${'#'.repeat(i*2).padEnd(20,'-')}] ${i*10}%`;
          if(i===0)t.h('<span id="pgs"></span>');$('#pgs').textContent=d.textContent}
        $('#pgs').removeAttribute('id');inst.add(k);$('#pk').textContent=inst.size+' pkgs';
      }
      return;
    }
    if(/^-R/.test(f)&&pk.length){
      if(need())return;
      for(const k of pk){if(inst.delete(k))t.p(`removing ${k}...`);else t.p(`error: target not found: ${k}`,'r')}
      $('#pk').textContent=inst.size+' pkgs';return;
    }
    t.p('usage: pacman -S <pkg> | -Syu | -Ss <q> | -Q | -R <pkg>   (avec sudo)');
  }
});

/* ---------- wiki ---------- */

/* ---------- boot ---------- */
let skip=false;
addEventListener('keydown',()=>skip=true);$('#boot').addEventListener('click',()=>skip=true);
(async()=>{
  const B=$('#boot');
  const L=['GRUB loading Arch Linux...','Loading Linux linux ...','Loading initial ramdisk ...','',
    ...['Mounted /boot.','Reached target Local File Systems.','Started Network Manager.','Started D-Bus System Message Bus.','Reached target Multi-User System.','Started archweb tiling manager.']
      .map(s=>'[<span class="ok">  OK  </span>] '+s),'','Arch Linux 6.12.0-arch1-1 (tty1)','','archweb login: user (autologin)'];
  for(const l of L){B.innerHTML+=l+'\n';if(skip)break;await sleep(l?170:60)}
  await sleep(skip?0:400);
  B.remove();$('#desk').hidden=false;$('#pk').textContent=inst.size+' pkgs';
  const t1=spawn('term');spawn('wiki');focus=WS[0][0];tile();
  t1.term.inp.value='neofetch';t1.term.inp.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter'}));
  setTimeout(()=>t1.term.h('\n<span class="y">→ Synapse : clique le bouton « synapse » en haut, ou tape</span> <span class="a">synapse</span>\n<span class="y">→ Bureau avec dock et icône Synapse : bouton « Lumen » en haut</span>'),80);
})();

/* ---------- entrées globales ---------- */
addEventListener('keydown',e=>{
  if(!e.altKey)return;
  const c=e.code;let h=true;
  if(c==='Enter')spawn('term');
  else if(c==='KeyQ'&&e.shiftKey){focus&&closeWin(focus)}
  else if(/^Digit[1-4]$/.test(c)){const n=+c[5]-1;e.shiftKey?moveTo(n):switchWs(n)}
  else if(c==='KeyJ')cycle(1);
  else if(c==='KeyK')cycle(-1);
  else if(c==='KeyW')spawn('wiki');
  else if(c==='KeyB')spawn('btop');
  else if(c==='KeyS')spawn('syn');
  else if(c==='KeyM')setMode(mode==='win'?'tile':'win');
  else h=false;
  if(h)e.preventDefault();
});
$('#bar').addEventListener('click',e=>{
  const s=e.target.closest('[data-sp]'),w=e.target.closest('[data-ws]');
  if(s)spawn(s.dataset.sp);else if(w)switchWs(+w.dataset.ws);
});
function setMode(m){
  mode=m;document.body.classList.toggle('winmode',m==='win');
  ALL().forEach(w=>{w.init=false;w.min=false});
  closeLC();$('#mode').textContent=m==='win'?'Arch':'Lumen';
  if(!ALL().includes(focus)||(m==='tile'&&!WS[cur].includes(focus)))focus=(m==='win'?ALL().at(-1):WS[cur][0])||null;
  tile();
}
function minimize(w){
  const fin=()=>{w.el.classList.remove('minimizing');w.min=true;focus=ALL().filter(x=>!x.min).at(-1)||null;tile()};
  const d=$(`#dock [data-app="${w.type}"]`);
  if(mode!=='win'||!d)return fin();
  const r=w.el.getBoundingClientRect(),q=d.getBoundingClientRect(),st=w.el.style;
  st.setProperty('--tx',(q.left+q.width/2-r.left-r.width/2)+'px');
  st.setProperty('--ty',(q.top+q.height/2-r.top-r.height/2)+'px');
  w.el.classList.add('minimizing');setTimeout(fin,320);
}
function toggleMax(w){
  w.el.classList.add('tr');setTimeout(()=>w.el.classList.remove('tr'),380);
  const s=w.el.style,a=$('#area');
  if(!w.max){w.prev=[s.left,s.top,s.width,s.height];Object.assign(s,{left:'0px',top:'0px',width:a.clientWidth+'px',height:a.clientHeight+'px'});w.max=true}
  else{[s.left,s.top,s.width,s.height]=w.prev;w.max=false}
}
$('#area').addEventListener('pointerdown',e=>{
  if(mode!=='win')return;
  const tb=e.target.closest('.tb');if(!tb||e.target.closest('b'))return;
  const el=tb.parentElement,w=ALL().find(x=>x.el===el);if(!w||w.max)return;
  const sx=e.clientX-el.offsetLeft,sy=e.clientY-el.offsetTop;document.body.classList.add('dragging');
  const mv=ev=>{el.style.left=Math.max(0,ev.clientX-sx)+'px';el.style.top=Math.max(0,ev.clientY-sy)+'px'};
  const up=()=>{document.body.classList.remove('dragging');removeEventListener('pointermove',mv);removeEventListener('pointerup',up)};
  addEventListener('pointermove',mv);addEventListener('pointerup',up);
});
const bounce=k=>requestAnimationFrame(()=>{const d=$(`#dock [data-app="${k}"]`);if(d){d.classList.add('bounce');setTimeout(()=>d.classList.remove('bounce'),900)}});
const openApp=k=>{
  const w=ALL().filter(x=>x.type===k).at(-1);
  if(!w){spawn(k);bounce(k);return}
  if(w.min){w.min=false;w._rs=1;focus=w}
  else if(focus===w){minimize(w);return}
  else focus=w;
  w.z=++Z;tile();
};
const closeLC=()=>$('#lc').classList.remove('open');
function fillLC(q){$('#lcg').innerHTML=Object.keys(APPS).filter(k=>APPS[k].n.toLowerCase().includes(q.toLowerCase())).map((k,i)=>`<div class="ap" style="animation-delay:${i*40}ms" data-app="${k}">${ico(k,60)}${APPS[k].n}</div>`).join('')}
function openLC(){const l=$('#lc'),i=l.querySelector('input');l.classList.add('open');i.value='';fillLC('');i.focus()}
$('#lc input').addEventListener('input',e=>fillLC(e.target.value));
$('#lc input').addEventListener('keydown',e=>{if(e.key==='Enter'){const a=$('#lcg .ap');if(a){closeLC();openApp(a.dataset.app)}}});
addEventListener('keydown',e=>{
  if(e.key==='Escape')closeLC();
  if(mode==='win'&&e.altKey&&e.code==='Space'){e.preventDefault();openLC()}
});
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('#mode')){setMode(mode==='win'?'tile':'win');return}
  if(t.closest('[data-start],[data-lc]')){openLC();return}
  const a=t.closest('#dock [data-app],#lc [data-app],#dsk [data-app]');
  if(a){closeLC();openApp(a.dataset.app);return}
  if(t.id==='lc')closeLC();
});
$('#dock').addEventListener('mousemove',e=>{document.querySelectorAll('#dock .dk').forEach(d=>{const q=d.getBoundingClientRect(),k=1+.6*Math.max(0,1-Math.abs(e.clientX-(q.left+q.width/2))/120)**2;d.style.transform=`translateY(${-(k-1)*20}px) scale(${k})`})});
$('#dock').addEventListener('mouseleave',()=>document.querySelectorAll('#dock .dk').forEach(d=>d.style.transform=''));
$('#dsk').innerHTML=`<div class="di" data-app="syn">${ico('syn',60)}Synapse</div>`;
addEventListener('blur',()=>setTimeout(()=>{const a=document.activeElement;if(a&&a.tagName==='IFRAME'){const w=ALL().find(x=>x.el.contains(a));if(w&&(focus!==w||w.z!==Z)){focus=w;w.z=++Z;tile()}}}));
if(navigator.getBattery)navigator.getBattery().then(b=>{const f=()=>$('#bat').textContent='BAT '+Math.round(b.level*100)+'%';f();b.onlevelchange=f}).catch(()=>{});
addEventListener('resize',tile);
const clk=()=>{$('#clk').textContent=new Date().toLocaleString('fr-FR',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})};
clk();setInterval(clk,15000);
</script>
